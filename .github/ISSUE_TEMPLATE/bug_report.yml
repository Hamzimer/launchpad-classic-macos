name: Bug report
description: Report a reproducible problem in Launchpad Classic
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem. Remove personal information from screenshots and logs. For security vulnerabilities, follow SECURITY.md instead.
  - type: input
    id: app-version
    attributes:
      label: Launchpad Classic version
      placeholder: 3.14.0
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.0 on MacBook Air (Apple silicon)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Launchpad Classic
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Drag files here after checking that they contain no personal information.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I tested the latest release.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
